services:
  postgres:
    image: postgres:17
    container_name: bolao-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: bolao_dev_user
      POSTGRES_PASSWORD: bolao_dev_password
      POSTGRES_DB: bolao_dev
    ports:
      - "5432:5432"
    volumes:
      - bolao_postgres_dev_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: bolao-pgadmin-dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bolao.dev
      PGADMIN_DEFAULT_PASSWORD: bolao_dev_admin
    ports:
      - "8080:80"

volumes:
  bolao_postgres_dev_data:
