}
function commit(msg){
  if(mode==='load'){ready.then(function(){commit(msg);});return;}
  state.updated=Date.now();render();
  if(mode==='shared'){clearTimeout(pubT);pubT=setTimeout(publishNow,350);toast(msg||'Salvando...');}
  else if(mode==='local'){if(saveLocal()){if(msg)toast(msg);}else{toast('⚠️ O celular bloqueou o salvamento. Faça o backup em Ajustes.');render();}}
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function money(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function num(s){s=String(s==null?'':s).replace(/[^\d,.\-]/g,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n;}
function hasNum(s){return String(s==null?'':s).replace(/[^\d]/g,'')!=='';}
function pct(n){return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';}
function br(n){return String(n).replace('.',',');}
function isoDate(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fmtDate(s){if(!s)return 'sem data';var p=String(s).split('-');return p.length<3?esc(s):p[2]+'/'+p[1]+'/'+p[0];}
function findB(id){for(var i=0;i<state.boloes.length;i++)if(state.boloes[i].id===id)return state.boloes[i];return null;}
function findF(id){for(var i=0;i<state.funcs.length;i++)if(state.funcs[i].id===id)return state.funcs[i];return null;}
function syncVendas(b){var v={};b.lanc.forEach(function(l){v[l.fid]=(v[l.fid]||0)+(+l.cotas||0);});b.vendas=v;}
function cotas(b,f){return +b.vendas[f.id]||0;}
function fmtTs(ts){if(!ts)return '';var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function sortLanc(a,b){return String(b.data).localeCompare(String(a.data))||(b.ts||0)-(a.ts||0);}
function lancRow(l,b,del){var f=findF(l.fid),nm=f?f.nome:'(funcionária removida)';
  return '<div class="it"><div class="grow"><div class="nm">'+esc(nm)+' · '+l.cotas+' cota'+(l.cotas>1?'s':'')+'</div><div class="muted">Venda em '+fmtDate(l.data)+' · '+money(l.cotas*(+b.valorCota||0))+'<br>'+(l.migrado?'Lançada antes do histórico':'Registrada em '+fmtTs(l.ts))+'</div></div>'+(del?'<button class="ico" data-a="lDel" data-id="'+l.id+'" aria-label="Remover lançamento">'+IC.trash+'</button>':'')+'</div>';}
function usaFaixa(f){return state.config.faixasOn&&state.config.faixas.length&&(+f.meta>0);}
function tierFor(f,mval){
  if(!usaFaixa(f))return {p:+f.pct||0,a:null,next:null};
  var at=mval/(+f.meta)*100,fx=state.config.faixas.slice().sort(function(x,y){return x.a-y.a;}),cur=null,next=null;
  fx.forEach(function(x){if(at>=x.a)cur=x;else if(!next)next=x;});
  return {p:cur?cur.p:(+state.config.abaixo||0),a:at,cur:cur,next:next};
}
function salesIn(f,de,ate){var c=0,v=0;state.boloes.forEach(function(b){var d=b.data||'';if(d<de||d>ate)return;var n=cotas(b,f);c+=n;v+=n*(+b.valorCota||0);});return f.mtipo==='cotas'?c:v;}
function monthRange(d){d=d||today;var y=d.slice(0,4),m=d.slice(5,7),last=new Date(+y,+m,0).getDate();return [y+'-'+m+'-01',y+'-'+m+'-'+('0'+last).slice(-2)];}
function pctOf(b,f){if(!usaFaixa(f))return +f.pct||0;var r=monthRange(b.data);return tierFor(f,salesIn(f,r[0],r[1])).p;}
function gerF(){var f=state.config.gerFid?findF(state.config.gerFid):null;return f||null;}
function isGer(f){return !!state.config.gerFid&&f&&f.id===state.config.gerFid;}
function gerName(){var f=gerF();return f?f.nome:state.config.gerente;}
function gerTel(){var f=gerF();return f?(f.tel||''):state.config.gerTel;}
var BASES={tarifa:'Tarifa',cota:'Cota inteira',bolao:'Valor do bolão'};
function baseOf(b){return b.base&&BASES[b.base]?b.base:state.config.base;}
function unitBase(b){var k=baseOf(b);return k==='tarifa'?(+b.tarifa||0):k==='bolao'?(+b.valorBolao||0):(+b.valorCota||0);}
function venda(b,f){return cotas(b,f)*(+b.valorCota||0);}
function tarifaF(b,f){return cotas(b,f)*(+b.tarifa||0);}
function baseF(b,f){return cotas(b,f)*unitBase(b);}
function comis(b,f){return baseF(b,f)*pctOf(b,f)/100;}
function gerOf(b,f){return isGer(f)?0:baseF(b,f)*(+f.gpct||0)/100;}
function baseTxt(b){return BASES[baseOf(b)].toLowerCase();}
function compTxt(b){return 'Bolão '+money(b.valorBolao)+' + tarifa '+money(b.tarifa)+' = cota '+money(b.valorCota);}
function totB(b){var t={cotas:0,venda:0,com:0,ger:0,tar:0,bol:0};state.funcs.forEach(function(f){t.cotas+=cotas(b,f);t.venda+=venda(b,f);t.tar+=tarifaF(b,f);t.bol+=cotas(b,f)*(+b.valorBolao||0);t.com+=comis(b,f);t.ger+=gerOf(b,f);});return t;}
function hasSales(f){return state.boloes.some(function(b){return cotas(b,f)>0;});}
function sortB(a,b){return String(b.data||'').localeCompare(String(a.data||''))||(b.criado||0)-(a.criado||0);}
function toast(t){var el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},2200);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copiado!');},function(){openModal({type:'copy',text:t});});}else openModal({type:'copy',text:t});}
function waLink(tel,text){var d=String(tel||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);}
var VIEWS=/^(boloes|fech|equipe|ajustes|b-[a-z0-9]+)$/;
function readHash(){var h='';try{h=(location.hash||'').replace(/^#/,'');}catch(e){}return VIEWS.test(h)?h:'';}
var curView=readHash();
if(!curView){try{var sv=sessionStorage.getItem('com-view');if(sv&&VIEWS.test(sv))curView=sv;}catch(e){}}
if(!curView)curView='boloes';
function route(){return curView;}
function go(v){
  curView=v;

/* ---------- fechamento ---------- */
function periodBoloes(){
  return state.boloes.filter(function(b){
    if(per.st==='aberto'&&b.pago)return false;
    var d=b.data||'';
    if(per.de&&d&&d<per.de)return false;
    if(per.ate&&d&&d>per.ate)return false;
    return true;
  }).sort(sortB);
}
function metaCalc(r){var f=r.f;r.meta=+f.meta||0;r.mtipo=f.mtipo==='cotas'?'cotas':'valor';r.mval=r.mtipo==='cotas'?r.cotas:r.venda;r.pm=r.meta?r.mval/r.meta*100:0;r.bateu=r.meta>0&&r.mval>=r.meta;r.bonus=r.bateu?(+f.bonus||0):0;}
function fmtMeta(tipo,n){return tipo==='cotas'?n+' cota'+(n!==1?'s':''):money(n);}
function calcPeriod(){
  var bs=periodBoloes(),rows=[],all=[],ger={total:0,itens:[],own:null},geral={venda:0,com:0,tar:0,bol:0,bonus:0};
  state.funcs.forEach(function(f){
    var r={f:f,cotas:0,venda:0,com:0,ger:0,tar:0,base:0,itens:[]};
    bs.forEach(function(b){var c=cotas(b,f);if(!c)return;r.cotas+=c;r.venda+=venda(b,f);r.tar+=tarifaF(b,f);r.ger+=gerOf(b,f);});
    metaCalc(r);r.tier=tierFor(f,r.mval);
    bs.forEach(function(b){var c=cotas(b,f);if(!c)return;var v=venda(b,f),bs2=baseF(b,f),cm=bs2*r.tier.p/100;r.com+=cm;r.base+=bs2;r.itens.push({b:b,c:c,v:v,cm:cm,p:r.tier.p,bs:bs2});});r.pagar=r.com+r.bonus;r.isGer=isGer(f);all.push(r);
    if(r.cotas){rows.push(r);ger.total+=r.ger;if(r.ger)ger.itens.push(r);if(r.isGer)ger.own=r;geral.venda+=r.venda;geral.com+=r.com;geral.tar+=r.tar;geral.bol+=r.venda-r.tar;geral.bonus+=r.bonus;}
  });
  ger.pagar=ger.total+(ger.own?ger.own.pagar:0);
  geral.pagar=geral.com+geral.bonus+ger.total;return {bs:bs,rows:rows,all:all,ger:ger,geral:geral};
}
function metaTxt(r){if(!r.meta)return '';return '\nMeta: '+fmtMeta(r.mtipo,r.meta)+' ('+pct(Math.round(r.pm))+')'+(r.bateu?' ✅ batida'+(r.bonus?', bônus '+money(r.bonus):''):', faltam '+fmtMeta(r.mtipo,r.meta-r.mval));}
function metaBar(v,meta,label,tipo){if(!meta)return '';var p=Math.min(100,v/meta*100),ok=v>=meta;return '<div class="row between muted" style="margin-top:8px"><span>'+label+' '+fmtMeta(tipo,meta)+'</span><b style="color:'+(ok?'var(--ac)':'var(--warn)')+'">'+pct(Math.round(v/meta*100))+(ok?' ✓':'')+'</b></div><div class="prog" style="margin:6px 0 2px"><i style="width:'+p+'%;background:'+(ok?'var(--ac)':'var(--warn)')+'"></i></div>'+(ok?'':'<div class="muted" style="font-size:12px">Faltam '+fmtMeta(tipo,meta-v)+'</div>');}
function tierTxt(r){if(!r.tier||r.tier.a==null)return '';return 'Atingiu '+pct(Math.round(r.tier.a))+' da meta → '+pct(r.tier.p)+(r.tier.next?' (faltam '+fmtMeta(r.mtipo,Math.max(0,r.meta*r.tier.next.a/100-r.mval))+' para '+pct(r.tier.next.p)+')':'');}
function perLabel(){return fmtDate(per.de)+' a '+fmtDate(per.ate);}
function itensTxt(r){return r.itens.map(function(i){return '• '+i.b.nome+': '+i.c+' cota'+(i.c>1?'s':'')+' (vendido '+money(i.v)+'), '+baseTxt(i.b)+' '+money(i.bs)+' × '+pct(i.p)+' = '+money(i.cm);}).join('\n');}
function txtFunc(r){
  return '💰 *Comissão dos bolões*\n'+state.config.nome+'\nPeríodo: '+perLabel()+'\n\n*'+r.f.nome+'*\n'+itensTxt(r)+
    '\n\nTotal vendido: '+money(r.venda)+'\nTarifas: '+money(r.tar)+metaTxt(r)+(tierTxt(r)?'\n'+tierTxt(r):'')+'\nComissão: '+money(r.com)+(r.bonus?'\nBônus da meta: '+money(r.bonus):'')+'\n*A receber: '+money(r.pagar)+'*';
}
function txtGer(c){
  var o=c.ger.own;
  return '💰 *Comissão da gerente*\n'+state.config.nome+'\nPeríodo: '+perLabel()+'\n\n*'+gerName()+'*\n'+
    (c.ger.itens.length?'Como gerente:\n'+c.ger.itens.map(function(r){return '• Sobre '+r.f.nome+': '+money(r.base)+' × '+pct(r.f.gpct)+' = '+money(r.ger);}).join('\n'):'')+
    (o?'\n\nVendas dela:\n'+itensTxt(o)+metaTxt(o)+(o.bonus?'\nBônus da meta: '+money(o.bonus):''):'')+
    '\n\n*A receber: '+money(c.ger.pagar)+'*';
}
function txtResumo(c){
  return '📊 *Fechamento de comissões*\n'+state.config.nome+'\nPeríodo: '+perLabel()+'\n'+c.bs.length+' bolões · vendido '+money(c.geral.venda)+'\nValor dos bolões: '+money(c.geral.bol)+'\nTarifas: '+money(c.geral.tar)+'\n\n'+
    c.rows.filter(function(r){return !r.isGer;}).map(function(r){return '• '+r.f.nome+': '+money(r.pagar)+(r.bonus?' (com bônus da meta)':'');}).join('\n')+
    (c.ger.pagar?'\n• '+gerName()+' (gerente): '+money(c.ger.pagar):'')+
    (state.config.metaLoja?'\n\nMeta da lotérica: '+money(state.config.metaLoja)+' ('+pct(Math.round(c.geral.venda/state.config.metaLoja*100))+')':'')+'\n\n*Total a pagar: '+money(c.geral.pagar)+'*';
}

function fmt2(n){return br((Math.round(n*100)/100).toFixed(2));}
function bolaoWarn(){var d=modal.d,hasCt=hasNum(d.valorCota),ct=num(d.valorCota);
  if(!hasCt&&(hasNum(d.tarifa)||hasNum(d.valorBolao)||hasNum(d.valorTotal)&&!(parseInt(d.qtdCotas,10)>0)))return '⚠️ Preencha o valor total da cota para eu calcular o valor do bolão e a tarifa.';
  if(hasCt&&!(ct>0))return '⚠️ O valor total da cota precisa ser maior que zero.';
  if(hasCt&&num(d.tarifa)>ct)return '⚠️ A tarifa está maior que o valor total da cota.';
  if(hasCt&&num(d.valorBolao)>ct)return '⚠️ O valor do bolão por cota está maior que o valor total da cota.';
  return '';}
function cotaTot(){var d=modal.d,q=parseInt(d.qtdCotas,10)||0,ct=num(d.valorCota);
  return '<div style="width:100%"><div class="row between"><span>Valor total da cota</span><span>'+money(ct)+'</span></div><div class="row between" style="font-weight:500;font-size:13px;margin-top:4px"><span>Bolão '+money(num(d.valorBolao))+' + tarifa '+money(num(d.tarifa))+'</span>'+(q?'<span>'+q+' cotas = '+money(ct*q)+'</span>':'')+'</div></div>';}
function setF(k,v){modal.d[k]=v;var el=document.querySelector('.sheet [data-f='+k+']');if(el&&document.activeElement!==el)el.value=v;}
function recalc(k){
  var d=modal.d,q=parseInt(d.qtdCotas,10)||0,hasCt=hasNum(d.valorCota),ct=num(d.valorCota);
  if(k==='valorTotal'&&q>0&&hasNum(d.valorTotal)){ct=num(d.valorTotal)/q;hasCt=true;setF('valorCota',fmt2(ct));}
  if(hasCt){
    if(k==='tarifa'){if(hasNum(d.tarifa))setF('valorBolao',fmt2(ct-num(d.tarifa)));else setF('valorBolao','');}
    else if(k==='valorBolao'){if(hasNum(d.valorBolao))setF('tarifa',fmt2(ct-num(d.valorBolao)));else setF('tarifa','');}
    else if(k==='valorCota'||k==='valorTotal'){if(hasNum(d.tarifa))setF('valorBolao',fmt2(ct-num(d.tarifa)));else if(hasNum(d.valorBolao))setF('tarifa',fmt2(ct-num(d.valorBolao)));}
    if((k==='valorCota'||k==='qtdCotas')&&q>0)setF('valorTotal',fmt2(ct*q));
  }
  var w=bolaoWarn(),we=document.getElementById('cwarn');if(we){we.innerHTML=w;we.style.display=w?'':'none';}
  var c=document.getElementById('ctot');if(c)c.innerHTML=cotaTot();
}

  var el=document.getElementById('modal');
  if(!modal){el.innerHTML='';return;}
  var old=el.querySelector('.sheet'),st=old&&!fresh?old.scrollTop:0;
  var body={bolao:mBolao,vendas:mVendas,func:mFunc,fx:mFx,copy:mCopy,restore:mRestore,confirm:mConfirm}[modal.type]();
  el.innerHTML='<div class="ov'+(fresh?'':' still')+'" data-a="ov"><div class="sheet"><div class="grab"></div>'+body+'</div></div>';
  var sh=el.querySelector('.sheet');if(sh)sh.scrollTop=st;
  if(modal.type==='copy'){var ta=document.getElementById('copyArea');if(ta){ta.focus();ta.select();}}
}
function confirmBox(title,msg,yesLabel,fn,danger){openModal({type:'confirm',title:title,msg:msg,yesLabel:yesLabel,yes:fn,danger:danger,prev:(modal&&FORMS.indexOf(modal.type)>=0)?modal:null});}

/* ---------- render ---------- */
function shell(){
  document.getElementById('root').innerHTML=
    '<header class="top"><div class="hin"><div class="logo">'+IC.logo+'</div><div><div class="ttl" id="hName"></div><div class="sub" id="hSub"></div></div><span class="mode" id="hMode"></span><button class="hsave" data-a="saveNow" aria-label="Salvar">'+IC.check+'<span id="hSaveT">Salvar</span></button></div></header>'+
    '<main class="wrap" id="main"></main><nav class="bot"><div class="nin">'+
    [['boloes','Bolões',IC.ticket],['fech','Fechamento',IC.calc],['equipe','Funcionários',IC.team],['ajustes','Ajustes',IC.gear]].map(function(t){return '<button data-a="nav" data-v="'+t[0]+'" id="nv-'+t[0]+'">'+t[2]+t[1]+'</button>';}).join('')+
    '</div></nav><div id="modal"></div><div class="toast" id="toast"></div>';
}
function render(){
  var r=route();
  var sub={boloes:'Bolões',fech:'Fechamento',equipe:'Funcionários',ajustes:'Ajustes'}[r]||'Bolão';
  document.getElementById('hName').textContent=state.config.nome;
  document.getElementById('hSub').textContent='Comissões · '+sub;
  var hm=document.getElementById('hMode'),mt={shared:['Nuvem',''],local:['No aparelho','local'],ro:['Só leitura','ro'],load:['...','load']}[mode];
  if(saveFail)mt=['Não salva','ro'];var hs=document.getElementById('hSaveT');if(hs){hs.textContent=saveFail?'Não salvou':(lastSave?'Salvo '+hhmm(lastSave):'Salvar');hs.parentNode.className='hsave'+(saveFail?' bad':'');}hm.textContent=mt[0];hm.className='mode '+mt[1];
  var tab=r.indexOf('b-')===0?'boloes':r;

  document.getElementById('main').innerHTML=h;
  if(modal)renderModal();
}

/* ---------- ações ---------- */
var FORMS=['bolao','func','vendas','restore','fx'],downOnOv=false;
document.addEventListener('pointerdown',function(e){downOnOv=!!(e.target&&e.target.classList&&e.target.classList.contains('ov'));},true);
var WRITE={editFx:1,saveFx:1,saveMeta:1,setBase:1,newB:1,editB:1,saveB:1,delB:1,vendas:1,saveVendas:1,togglePago:1,payAll:1,newF:1,editF:1,saveF:1,delF:1,saveGer:1,saveNome:1,restore:1,doRestore:1};
document.addEventListener('click',function(e){
  try{syncSheet();}catch(err){}
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),ds=el.dataset,b,f,c;
  if(a==='ov'){if(e.target===el&&downOnOv&&modal&&FORMS.indexOf(modal.type)<0)closeModal();return;}
  if(mode==='ro'&&WRITE[a]){toast('Acesso somente leitura');return;}
  switch(a){
    case 'nav':closeModal();go(ds.v);window.scrollTo(0,0);break;
    case 'open':go('b-'+ds.id);window.scrollTo(0,0);break;
    case 'editFx':openModal({type:'fx',d:{on:state.config.faixasOn!==false,abaixo:br(state.config.abaixo||0),list:state.config.faixas.slice().sort(function(x,y){return x.a-y.a;}).map(function(x){return {a:br(x.a),p:br(x.p)};})}});break;
    case 'fxTg':modal.dirty=true;modal.d.on=!modal.d.on;renderModal();break;
    case 'fxAdd':modal.dirty=true;modal.d.list.push({a:'',p:''});renderModal();break;
    case 'fxDel':modal.dirty=true;modal.d.list.splice(+ds.i,1);renderModal();break;
    case 'saveFx':
      var fl2=[],bad=false;modal.d.list.forEach(function(x){if(!hasNum(x.a)&&!hasNum(x.p))return;var aa=num(x.a),pp=num(x.p);if(!hasNum(x.a)||!hasNum(x.p)||aa<0||aa>1000||pp<0||pp>100)bad=true;fl2.push({a:aa,p:pp});});
      if(bad)return toast('Confira as faixas: meta de 0 a 1000% e comissão de 0 a 100%');
      fl2.sort(function(x,y){return x.a-y.a;});for(var z=1;z<fl2.length;z++)if(fl2[z].a===fl2[z-1].a)return toast('Há duas faixas com o mesmo % de meta');
      var ab=num(modal.d.abaixo);if(ab<0||ab>100)return toast('O % abaixo da primeira faixa vai de 0 a 100');
      if(modal.d.on&&!fl2.length)return toast('Adicione ao menos uma faixa ou desligue');
      state.config.faixas=fl2;state.config.faixasOn=!!modal.d.on;state.config.abaixo=ab;closeModal();commit('Faixas salvas');break;
    case 'saveNow':saveNow();break;
    case 'discard':
      if(modal&&modal.dirty){openModal({type:'confirm',title:'Descartar alterações?',msg:'O que você alterou não será salvo.',yesLabel:'Descartar',yes:function(){closeModal();},prev:modal});break;}
      closeModal();break;
    case 'close':
      if(modal&&modal.type==='confirm'&&modal.prev){modal=modal.prev;renderModal(true);break;}
      if(modal&&modal.dirty){openModal({type:'confirm',title:'Descartar alterações?',msg:'Você fez alterações que ainda não foram salvas. Quer sair mesmo assim?',yesLabel:'Descartar',yes:function(){closeModal();},prev:modal});break;}
      closeModal();break;
    case 'bf':bFilter=ds.f;render();break;
    case 'pst':per.st=ds.f;render();break;
    case 'newB':openModal({type:'bolao',d:{nome:'',data:today,valorCota:'',valorTotal:'',qtdCotas:'',valorBolao:'',tarifa:'',base:'',pct:''}});break;
    case 'editB':b=findB(ds.id);openModal({type:'bolao',d:{id:b.id,nome:b.nome,data:b.data||'',valorCota:fmt2(b.valorCota),valorTotal:+b.valorTotal?br(b.valorTotal):'',qtdCotas:+b.qtdCotas?String(b.qtdCotas):'',valorBolao:fmt2(b.valorBolao),tarifa:fmt2(b.tarifa),base:b.base||'',pct:b.pct!=null&&b.pct!==''?br(b.pct):''}});break;
    case 'saveB':
      var d=modal.d,nm=String(d.nome).trim(),bk=d.base||'';
      if(!nm)return toast('Informe o nome do bolão');
      if(!hasNum(d.valorCota)||!(num(d.valorCota)>0)){var we=document.getElementById('cwarn');if(we){we.innerHTML='⚠️ Preencha o valor total da cota.';we.style.display='';}var ic=document.querySelector('.sheet [data-f=valorCota]');if(ic)ic.focus();return toast('Preencha o valor total da cota');}
      if(!hasNum(d.tarifa)&&!hasNum(d.valorBolao))return toast('Preencha a tarifa ou o valor do bolão por cota');
      var vc=num(d.valorCota),tf=hasNum(d.tarifa)?num(d.tarifa):vc-num(d.valorBolao),vb=Math.round((vc-tf)*100)/100;
      if(tf<0||vb<0)return toast('Tarifa e valor do bolão não podem passar do valor da cota');
      var vtot=Math.max(0,num(d.valorTotal)),qc=Math.max(0,parseInt(d.qtdCotas,10)||0);
      var p=null;
      if(p!=null&&(p<0||p>100))return toast('Percentual entre 0 e 100');
      if(d.id){b=findB(d.id);b.nome=nm;b.data=d.data;b.valorBolao=vb;b.tarifa=tf;b.valorCota=vc;b.base=bk;b.pct=p;b.valorTotal=vtot;b.qtdCotas=qc;closeModal();commit('Bolão salvo');}
      else{b={id:uid(),nome:nm,data:d.data,valorTotal:vtot,qtdCotas:qc,valorBolao:vb,tarifa:tf,valorCota:vc,base:bk,pct:p,vendas:{},lanc:[],pago:false,criado:Date.now()};state.boloes.push(b);modal={type:'vendas',bid:b.id,list:[],add:{fid:'',qtd:1,data:today}};curView='b-'+b.id;try{sessionStorage.setItem('com-view',curView);location.hash=curView;}catch(e){}renderModal(true);commit('Bolão criado');}
      break;
    case 'delB':var bid=modal.d.id;confirmBox('Excluir bolão','Excluir este bolão e as vendas lançadas nele?','Excluir',function(){state.boloes=state.boloes.filter(function(x){return x.id!==bid;});closeModal();go('boloes');commit('Bolão excluído');});break;
    case 'vendas':b=findB(ds.id);openModal({type:'vendas',bid:b.id,list:b.lanc.map(function(l){return Object.assign({},l);}),add:{fid:'',qtd:1,data:today}});break;
    case 'aq':modal.addTouched=true;modal.add.qtd=Math.max(1,(parseInt(modal.add.qtd,10)||1)+(+ds.d));renderModal();break;
    case 'lAdd':
      b=findB(modal.bid);var ad=modal.add,qn=parseInt(ad.qtd,10)||0;
      if(!ad.fid)return toast('Escolha a funcionária');
      if(qn<1)return toast('Informe a quantidade de cotas');
      if(!ad.data)return toast('Informe a data da venda');
      if(+b.qtdCotas&&draftSum()+qn>b.qtdCotas)return toast('Passou do total: restam '+Math.max(0,b.qtdCotas-draftSum())+' cotas');
      modal.list.push({id:uid(),fid:ad.fid,cotas:qn,data:ad.data,ts:Date.now()});modal.dirty=true;modal.add={fid:ad.fid,qtd:1,data:ad.data};modal.addTouched=false;renderModal();toast('Venda adicionada. Toque em Salvar vendas.');break;
    case 'lDel':modal.dirty=true;modal.list=modal.list.filter(function(l){return l.id!==ds.id;});renderModal();break;
    case 'saveVendas':
      b=findB(modal.bid);if(+b.qtdCotas&&draftSum()>b.qtdCotas)return toast('Passou do total: '+draftSum()+' de '+b.qtdCotas+' cotas');
      if(modal.addTouched&&modal.add.fid)return toast('Você preencheu uma venda e não adicionou. Toque em "Adicionar à lista".');
      b.lanc=modal.list.map(function(l){return {id:l.id,fid:l.fid,cotas:+l.cotas,data:l.data,ts:l.ts,migrado:l.migrado||undefined};});syncVendas(b);closeModal();commit('Vendas salvas');break;
    case 'togglePago':b=findB(ds.id);b.pago=!b.pago;commit(b.pago?'Marcado como pago':'Marcado em aberto');break;
    case 'copyF':c=calcPeriod();c.rows.forEach(function(r){if(r.f.id===ds.id)copyText(txtFunc(r));});break;
    case 'copyG':copyText(txtGer(calcPeriod()));break;
    case 'copyR':copyText(txtResumo(calcPeriod()));break;
    case 'payAll':
      c=calcPeriod();var ids=c.bs.map(function(x){return x.id;});
      confirmBox('Marcar como pago','Marcar os <b>'+ids.length+' bolões</b> deste período como pagos? Eles saem do fechamento em aberto, e você pode reabrir quando quiser.','Marcar como pago',function(){state.boloes.forEach(function(x){if(ids.indexOf(x.id)>=0)x.pago=true;});closeModal();commit('Comissões marcadas como pagas');},false);break;
    case 'newF':openModal({type:'func',d:{nome:'',tel:'',pct:'',gpct:'',meta:'',bonus:'',mtipo:'valor',ativa:true}});break;
    case 'mtipo':modal.dirty=true;modal.d.mtipo=ds.k;renderModal();break;
    case 'editF':f=findF(ds.id);openModal({type:'func',d:{id:f.id,nome:f.nome,tel:f.tel||'',pct:br(f.pct),gpct:br(f.gpct||0),meta:+f.meta?br(f.meta):'',bonus:+f.bonus?br(f.bonus):'',mtipo:f.mtipo==='cotas'?'cotas':'valor',ativa:f.ativa!==false}});break;
    case 'ftg':modal.dirty=true;modal.d.ativa=modal.d.ativa===false;renderModal();break;
    case 'saveF':
      var fd=modal.d,fn=String(fd.nome).trim(),fp=num(fd.pct),gp=num(fd.gpct);
      if(!fn)return toast('Informe o nome');
      if(!hasNum(fd.pct))return toast('Informe o % de comissão');
      if(fp<0||fp>100||gp<0||gp>100)return toast('Percentuais entre 0 e 100');
      var mtp=fd.mtipo==='cotas'?'cotas':'valor',mt=Math.max(0,mtp==='cotas'?(parseInt(fd.meta,10)||0):num(fd.meta)),bn=Math.max(0,num(fd.bonus));if(fd.id&&state.config.gerFid===fd.id)gp=0;
      if(fd.id){f=findF(fd.id);f.nome=fn;f.tel=String(fd.tel).trim();f.pct=fp;f.gpct=gp;f.meta=mt;f.mtipo=mtp;f.bonus=bn;f.ativa=fd.ativa!==false;}
      else state.funcs.push({id:uid(),nome:fn,tel:String(fd.tel).trim(),pct:fp,gpct:gp,meta:mt,mtipo:mtp,bonus:bn,ativa:true});
      closeModal();commit('Funcionária salva');break;
    case 'delF':var fid=modal.d.id;confirmBox('Excluir funcionária','Excluir esta funcionária?','Excluir',function(){state.funcs=state.funcs.filter(function(x){return x.id!==fid;});if(state.config.gerFid===fid)state.config.gerFid='';closeModal();commit('Funcionária excluída');});break;
    case 'saveMeta':state.config.metaLoja=Math.max(0,num(document.getElementById('metaLoja').value));commit('Meta salva');break;
    case 'saveGer':var gn=document.getElementById('gNome').value.trim();if(!gn)return toast('Informe o nome');state.config.gerente=gn;state.config.gerTel=document.getElementById('gTel').value.trim();commit('Gerente salva');break;
    case 'saveNome':var n2=document.getElementById('cfgNome').value.trim();if(!n2)return toast('Informe um nome');state.config.nome=n2;commit('Nome salvo');break;
    case 'backup':copyText(JSON.stringify(state));break;
    case 'restore':openModal({type:'restore',txt:''});break;
    case 'doRestore':
      var obj=null;try{obj=JSON.parse(modal.txt);}catch(err){}
      if(!obj||!Array.isArray(obj.boloes)||!Array.isArray(obj.funcs))return toast('Backup inválido');
      confirmBox('Restaurar backup','Substituir os dados atuais por este backup?','Restaurar',function(){state=obj;fix();closeModal();go('boloes');commit('Backup restaurado');});break;
    case 'bBase':modal.dirty=true;modal.d.base=ds.k;renderModal();break;
    case 'setBase':state.config.base=ds.k;commit('Base da comissão salva');break;
    case 'yes':modal.yes();break;
  }
});
function onField(e){
  var t=e.target,k;if(!t||!t.getAttribute)return;
  if((k=t.getAttribute('data-per'))){if(per[k]===t.value)return;per[k]=t.value;if(e.type==='change'||t.type!=='date')render();return;}
  if((k=t.getAttribute('data-fx'))&&modal&&modal.type==='fx'){modal.dirty=true;var pr=k.split('-');modal.d.list[+pr[1]][pr[0]]=t.value;return;}
  if((k=t.getAttribute('data-add'))&&modal&&modal.add){modal.add[k]=t.value;modal.addTouched=true;return;}
  if((k=t.getAttribute('data-q'))&&modal){modal.dirty=true;modal.q[k]=Math.max(0,parseInt(t.value,10)||0);var vt=document.getElementById('vtot');if(vt)vt.innerHTML=vendTot();return;}
  if((k=t.getAttribute('data-f'))&&modal){var cur=modal.d?modal.d[k]:modal[k];if(cur===t.value)return;modal.dirty=true;if(modal.d)modal.d[k]=t.value;else modal[k]=t.value;if(modal.type==='bolao'&&['valorCota','tarifa','valorBolao','valorTotal','qtdCotas'].indexOf(k)>=0)recalc(k);}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
/* lê tudo que está escrito na janela aberta (o iPhone nem sempre avisa quando um campo muda) */
function syncSheet(){
  if(!modal)return;var sh=document.querySelector('.sheet');if(!sh)return;
  var els=sh.querySelectorAll('input,select,textarea');
  for(var i=0;i<els.length;i++){var t=els[i],k;
    if((k=t.getAttribute('data-f'))){var cur=modal.d?modal.d[k]:modal[k];if(cur!==t.value){modal.dirty=true;if(modal.d)modal.d[k]=t.value;else modal[k]=t.value;}}
    else if((k=t.getAttribute('data-add'))&&modal.add){if(modal.add[k]!=t.value){modal.add[k]=t.value;modal.addTouched=true;}}
    else if((k=t.getAttribute('data-fx'))&&modal.type==='fx'){var pr=k.split('-');if(modal.d.list[+pr[1]]&&modal.d.list[+pr[1]][pr[0]]!==t.value){modal.d.list[+pr[1]][pr[0]]=t.value;modal.dirty=true;}}
  }
}
document.addEventListener('focusin',function(e){if(e.target.hasAttribute('data-q')||e.target.getAttribute('data-add')==='qtd')e.target.select();});
document.addEventListener('change',function(e){var ka=e.target.getAttribute&&e.target.getAttribute('data-add');if(ka&&modal&&modal.add){modal.add[ka]=e.target.value;modal.addTouched=true;return;}if(e.target.id==='gSel'){if(mode==='ro'){toast('Acesso somente leitura');render();return;}state.config.gerFid=e.target.value;var gg=gerF();if(gg)gg.gpct=0;commit(gg?gg.nome+' agora é a gerente':'Gerente atualizada');}});
function bgSave(){if(mode==='local')saveLocal();}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')bgSave();});
window.addEventListener('pagehide',bgSave);
window.addEventListener('hashchange',function(){var h=readHash();if(!h||h===curView)return;if(modal&&modal.dirty)return;curView=h;render();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal&&FORMS.indexOf(modal.type)<0){var x=document.querySelector('.sheet [data-a=close]');if(x)x.click();}});
shell();render();initRuntime();
})();
